</style><script type="importmap">{"imports":{"three":"../vendor/three.module.js","three/addons/":"../vendor/"}}</script></head><body><header><h1>关节组织 · 候选对照</h1><a href="../">返回骨架</a></header><main><section id="viewer"><div id="status" role="status">读取候选数据…</div><div id="hint">拖动旋转 · 滚轮缩放 · 右键 / 双指平移 · 点击组织查看名称</div></section><aside><div class="tabs" aria-label="选择核查部位"><button data-case="knee">右膝</button><button data-case="shoulder">右肩</button><button data-case="lumbar">腰椎</button></div><h2 id="title">候选结构</h2><p class="note">仅用于检查资源与骨架匹配。未经解剖验收，未接入主骨架；红色仅用于区分组织。</p><label><input id="target" type="checkbox" checked><span><i class="legend" style="background:#aaa698"></i>现用骨架</span></label><label><input id="source" type="checkbox"><span><i class="legend" style="background:#5885ae"></i>来源骨架（刚性配准后）</span></label><label><input id="tissue" type="checkbox" checked><span><i class="legend" style="background:#b96059"></i>候选关节组织</span></label><label for="opacity">骨骼透明度 <output id="opacity-value">30%</output></label><input id="opacity" type="range" min="10" max="100" value="30"><label id="nucleus-control" hidden><input id="nucleus" type="checkbox">单独查看髓核（隐藏整体椎间盘）</label><button id="home">聚焦关节</button><div id="selection">点击红色组织查看名称。</div><div class="rule"><h2>配准检查</h2><div id="metrics"></div><p>数值为抽样骨面单向近邻距离，并非软组织精度。仅平移和旋转，未缩放、未按关节面单独修形。</p><p>来源：Z-Anatomy / BodyParts3D。逐对象许可及适配状态待核查，仅本地研究预览。</p></div></aside></main><script type="module" src="app.js"></script></body></html>
