<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Day 47 样稿</title><link rel="icon" type="image/svg+xml" href="assets/a6d8e5caaa61ed31.svg"><style>:root { color-scheme: light; --ink: #111113; --muted: #71717a; --line: #e4e4e7; --accent: #ff5a1f; --green: #0ea66b; --blue: #2563eb; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; font-synthesis: none; letter-spacing: 0; }
* { box-sizing: border-box; }
body { margin: 0; color: var(--ink); overflow-wrap: anywhere; }
button, input { font: inherit; }
button { cursor: pointer; }
img { display: block; max-width: 100%; }
button:focus-visible, a:focus-visible, summary:focus-visible, input:focus-visible { outline: 2px solid var(--blue); outline-offset: 4px; }
svg.icon { width: 20px; height: 20px; }
.icon-button { display: inline-grid; place-items: center; width: 40px; height: 40px; padding: 0; border: 1px solid var(--line); border-radius: 6px; background: white; }
[hidden] { display: none !important; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; } }

body{height:100dvh;display:flex;flex-direction:column;background:white}header{display:flex;align-items:center;gap:16px;padding:10px 20px;border-bottom:1px solid var(--line);min-height:64px}header>img{width:40px;height:40px;object-fit:contain}header>span{font-size:14px;color:var(--muted)}nav{display:flex;gap:20px;margin-left:auto}nav button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 0;color:var(--muted);font-size:14px}nav button[aria-pressed=true]{color:var(--accent);border-color:var(--accent)}header a{color:var(--ink);display:grid;place-items:center;width:36px;height:36px}iframe{width:100%;flex:1;min-height:0;border:0}@media(max-width:420px){header{gap:10px;padding:8px 12px}nav{gap:12px}header>span{display:none}}</style></head><body><header><img src="assets/a6d8e5caaa61ed31.svg" alt="Logo"><span>Day 47</span><nav aria-label="预览格式"><button aria-pressed="true" data-view="lesson.html">网站 HTML</button><button aria-pressed="false" data-view="xhs/index.html">小红书</button></nav><a href="xhs.zip" download title="下载小红书包" aria-label="下载小红书包"><svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 15V3" /><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><path d="m7 10 5 5 5-5" /></svg></a></header><iframe title="网站 HTML 预览" src="lesson.html"></iframe><script>document.querySelectorAll('[data-view]').forEach(button=>button.addEventListener('click',()=>{document.querySelector('iframe').src=button.dataset.view;document.querySelector('iframe').title=button.textContent+'预览';document.querySelectorAll('[data-view]').forEach(tab=>tab.setAttribute('aria-pressed',String(tab===button)));}));</script></body></html>
