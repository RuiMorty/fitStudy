<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1536" viewBox="0 0 1024 1536">
  <defs>
    <filter id="panelShadow" x="-10%" y="-20%" width="120%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#542017" flood-opacity=".15"/>
    </filter>
    <marker id="arrow" markerWidth="20" markerHeight="20" refX="17" refY="10" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0,0 L20,10 L0,20 Z" fill="#941B1B"/>
    </marker>
    <style>
      .cn { font-family: 'PingFang SC','Noto Sans CJK SC','Microsoft YaHei',sans-serif; }
      .label { fill:#941B1B; font-size:50px; font-weight:800; }
      .leader { fill:none; stroke:#941B1B; stroke-width:6px; stroke-linecap:round; }
      .motion { fill:none; stroke:#941B1B; stroke-width:11px; stroke-linecap:round; marker-end:url(#arrow); }
      .dot { fill:#941B1B; stroke:#FFFFFF; stroke-width:5px; }
    </style>
  </defs>

  <!-- Base: original labeled poster. The upper four movement arrows remain unmodified. -->
  <image href="../../xhs-wrong-notebook/2026-09-21-anatomy/04-scapular-movement-labeled.png" width="1024" height="1536"/>

  <!-- Only the incorrect protraction/retraction zone is replaced. -->
  <g filter="url(#panelShadow)">
    <rect x="34" y="890" width="450" height="210" rx="32" fill="#FCF4E7" stroke="#D7B89E" stroke-width="3"/>
    <rect x="540" y="890" width="450" height="210" rx="32" fill="#FCF4E7" stroke="#D7B89E" stroke-width="3"/>
  </g>

  <!-- Viewer-left scapula: retraction travels medially, toward the spine. -->
  <text class="cn label" x="62" y="1040">后缩</text>
  <path class="leader" d="M262 875 L298 950"/><circle class="dot" cx="262" cy="875" r="12"/>
  <path class="motion" d="M298 950 L430 950"/>

  <!-- Viewer-right scapula: protraction travels laterally, away from the spine. -->
  <text class="cn label" x="850" y="1040">前伸</text>
  <path class="leader" d="M764 875 L795 950"/><circle class="dot" cx="764" cy="875" r="12"/>
  <path class="motion" d="M795 950 L932 950"/>
</svg>
